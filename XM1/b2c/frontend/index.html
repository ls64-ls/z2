<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B2C商城后台管理</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: #f0f2f5;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: 900px;
            height: 540px;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            display: flex;
            overflow: hidden;
        }

        .login-left {
            flex: 1;
            background: linear-gradient(135deg, #e8f3ff 0%, #f0f7ff 50%, #e6f4ff 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .login-left svg {
            width: 80%;
            height: auto;
        }

        .login-right {
            flex: 1;
            padding: 60px 50px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .login-title {
            font-size: 22px;
            font-weight: 600;
            color: #1f2937;
            margin-bottom: 8px;
            text-align: center;
        }

        .login-subtitle {
            font-size: 13px;
            color: #9ca3af;
            text-align: center;
            margin-bottom: 32px;
        }

        .login-tabs {
            display: flex;
            border-bottom: 1px solid #e5e7eb;
            margin-bottom: 28px;
        }

        .login-tab {
            flex: 1;
            text-align: center;
            padding: 12px 0;
            font-size: 15px;
            color: #6b7280;
            cursor: pointer;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
            user-select: none;
        }

        .login-tab.active {
            color: #2563eb;
            border-bottom-color: #2563eb;
            font-weight: 500;
        }

        .login-tab:hover:not(.active) {
            color: #374151;
        }

        .form-group {
            margin-bottom: 18px;
            position: relative;
        }

        .form-group input {
            width: 100%;
            height: 44px;
            padding: 0 16px 0 42px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            color: #1f2937;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: #2563eb;
        }

        .form-group input::placeholder {
            color: #9ca3af;
        }

        .form-group .icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            width: 18px;
            height: 18px;
            color: #9ca3af;
        }

        .login-btn {
            width: 100%;
            height: 44px;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 8px;
        }

        .login-btn:hover {
            background: #1d4ed8;
        }

        .login-btn:active {
            background: #1e40af;
        }

        .login-footer {
            text-align: center;
            margin-top: 24px;
            font-size: 12px;
            color: #9ca3af;
        }

        .toast {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: rgba(0, 0, 0, 0.75);
            color: #fff;
            padding: 10px 24px;
            border-radius: 6px;
            font-size: 14px;
            z-index: 9999;
            transition: transform 0.3s ease;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-left">
            <svg viewBox="0 0 400 360" xmlns="http://www.w3.org/2000/svg">
                <!-- 背景圆 -->
                <circle cx="200" cy="180" r="140" fill="#dbeafe" opacity="0.5"/>
                <circle cx="320" cy="80" r="30" fill="#bfdbfe" opacity="0.4"/>
                <circle cx="80" cy="280" r="20" fill="#bfdbfe" opacity="0.3"/>

                <!-- 图表柱子 -->
                <rect x="120" y="200" width="24" height="80" rx="3" fill="#3b82f6" opacity="0.8"/>
                <rect x="155" y="170" width="24" height="110" rx="3" fill="#60a5fa"/>
                <rect x="190" y="150" width="24" height="130" rx="3" fill="#3b82f6"/>
                <rect x="225" y="185" width="24" height="95" rx="3" fill="#93c5fd"/>
                <rect x="260" y="165" width="24" height="115" rx="3" fill="#3b82f6" opacity="0.8"/>

                <!-- 图表折线 -->
                <polyline points="120,180 155,150 190,130 225,165 260,140 290,120"
                          fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round"/>
                <circle cx="190" cy="130" r="5" fill="#2563eb"/>
                <circle cx="290" cy="120" r="5" fill="#2563eb"/>

                <!-- 钱币图标 -->
                <circle cx="100" cy="100" r="28" fill="#fbbf24"/>
                <text x="100" y="110" text-anchor="middle" font-size="28" font-weight="bold" fill="#d97706">¥</text>

                <!-- 百分比图标 -->
                <circle cx="310" cy="220" r="26" fill="#34d399"/>
                <text x="310" y="228" text-anchor="middle" font-size="20" font-weight="bold" fill="#059669">%</text>

                <!-- 人形图标 -->
                <circle cx="200" cy="60" r="16" fill="#60a5fa"/>
                <rect x="184" y="78" width="32" height="40" rx="16" fill="#60a5fa"/>

                <!-- 小装饰点 -->
                <circle cx="70" cy="150" r="4" fill="#93c5fd"/>
                <circle cx="340" cy="150" r="4" fill="#93c5fd"/>
                <circle cx="350" cy="290" r="3" fill="#bfdbfe"/>
            </svg>
        </div>

        <div class="login-right">
            <div class="login-title">B2C商城后台管理</div>
            <div class="login-subtitle">欢迎登录，请输入您的账号信息</div>

            <div class="login-tabs">
                <div class="login-tab active" data-type="shop" onclick="switchTab(this)">店铺登录</div>
                <div class="login-tab" data-type="store" onclick="switchTab(this)">门店登录</div>
            </div>

            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                        <circle cx="12" cy="7" r="4"/>
                    </svg>
                    <input type="text" id="username" placeholder="请输入用户名" value="zhushilu" autocomplete="off">
                </div>
                <div class="form-group">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="11" width="18" height="11" rx="2"/>
                        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    </svg>
                    <input type="password" id="password" placeholder="请输入密码">
                </div>
                <button type="submit" class="login-btn">登录</button>
            </form>

            <div class="login-footer">© 2024 B2C Mall Management System</div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        let currentTab = 'shop';

        function switchTab(el) {
            document.querySelectorAll('.login-tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            currentTab = el.dataset.type;
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!username) {
                showToast('请输入用户名');
                return;
            }
            if (!password) {
                showToast('请输入密码');
                return;
            }

            const loginType = currentTab === 'shop' ? '店铺' : '门店';
            showToast(`${loginType}登录中...`);

            try {
                const resp = await fetch('http://localhost:8092/employee/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ shopId: 3, username, password })
                });
                const data = await resp.json();
                if (data.status === 200) {
                    showToast('登录成功！');
                    setTimeout(() => { window.location.href = 'dashboard.html'; }, 800);
                } else {
                    showToast(data.message || '登录失败');
                }
            } catch (err) {
                showToast('网络错误，请检查后端服务');
            }
        }
    </script>
</body>
</html>
