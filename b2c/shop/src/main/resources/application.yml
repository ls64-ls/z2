server:
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/b2cmall_shop?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}"
    username: "${SPRING_DATASOURCE_USERNAME:root}"
    password: "${SPRING_DATASOURCE_PASSWORD:root123456}"

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.zsl.b2cmall.shop.entity
  configuration:
    map-underscore-to-camel-case: true
