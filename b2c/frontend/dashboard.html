<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>店铺 Dashboard - B2C 商城后台</title>
    <link rel="stylesheet" href="assets/common.css">
    <style>
        .stats-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px; margin-bottom: 18px; }
        .stat-card {
            background: #fff; border-radius: 10px; padding: 18px; cursor: pointer;
            box-shadow: 0 1px 3px rgba(0,0,0,.05); transition: all .2s;
        }
        .stat-card:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,.09); }
        .stat-icon {
            width: 40px; height: 40px; border-radius: 10px; display: flex;
            align-items: center; justify-content: center; margin-bottom: 12px;
        }
        .stat-icon svg { width: 20px; height: 20px; color: #fff; }
        .stat-value { font-size: 26px; font-weight: 700; line-height: 1.1; }
        .stat-label { font-size: 13px; color: #9ca3af; margin-top: 6px; }

        .content-grid { display: grid; grid-template-columns: 1fr 370px; gap: 16px; margin-bottom: 18px; }
        .chart-card { min-width: 0; }
        .legend { display: flex; gap: 18px; font-size: 12px; color: #6b7280; }
        .legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
        .chart-wrap { position: relative; height: 280px; }
        #trendChart { width: 100%; height: 280px; display: block; }

        .message-list { max-height: 308px; overflow-y: auto; }
        .message-item {
            padding: 11px 8px; border-bottom: 1px solid #f3f4f6; cursor: pointer;
            border-radius: 6px; transition: background .2s;
        }
        .message-item:last-child { border-bottom: none; }
        .message-item:hover { background: #f9fafb; }
        .message-top { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
        .message-dot { width: 7px; height: 7px; border-radius: 50%; background: #ef4444; flex-shrink: 0; }
        .message-dot.read { background: #e5e7eb; }
        .message-title { font-size: 13px; font-weight: 500; flex: 1; }
        .message-content { font-size: 12px; color: #9ca3af; line-height: 1.6; padding-left: 15px; }
        .message-time { font-size: 11px; color: #d1d5db; padding-left: 15px; margin-top: 3px; }

        .metrics-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
        .metric-card { background: #fff; border-radius: 10px; padding: 18px 20px; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
        .metric-name { font-size: 13px; color: #6b7280; }
        .metric-value { font-size: 24px; font-weight: 700; margin: 8px 0 6px; }
        .metric-rate { font-size: 12px; }
        .rate-up { color: #16a34a; }
        .rate-down { color: #dc2626; }
        .rate-bad { color: #dc2626; }
        @media (max-width: 1200px) {
            .stats-grid { grid-template-columns: repeat(3, 1fr); }
            .content-grid { grid-template-columns: 1fr; }
            .metrics-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
<div class="header">
    <div class="header-logo">B2C商城 <span>商家后台</span></div>
    <div class="header-nav">
        <a class="header-nav-item" data-nav="dashboard" href="dashboard.html">店铺 Dashboard</a>
        <a class="header-nav-item" data-nav="product" href="product-manage.html">商品管理</a>
        <a class="header-nav-item" data-nav="order" href="order-manage.html">订单管理</a>
        <a class="header-nav-item" href="mall.html">C 端商城</a>
    </div>
    <div class="header-right">
        <span id="shopName">ZSL 甄选旗舰店</span>
        <div class="user-avatar">商</div>
    </div>
</div>

<div class="main">
    <div class="page-title">店铺数据概览</div>

    <!-- 6 个订单状态卡片 -->
    <div class="stats-grid" id="statsGrid">
        <div class="stat-card" onclick="location.href='order-manage.html?status=CREATED'">
            <div class="stat-icon" style="background:linear-gradient(135deg,#fbbf24,#f59e0b)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
            </div>
            <div class="stat-value" id="cPendingPay">0</div>
            <div class="stat-label">待付款订单</div>
        </div>
        <div class="stat-card" onclick="location.href='order-manage.html?status=PAID'">
            <div class="stat-icon" style="background:linear-gradient(135deg,#60a5fa,#3b82f6)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h13v10H3z"/><path d="M16 10h3l2 3v4h-5z"/><circle cx="7" cy="19" r="1.6"/><circle cx="17" cy="19" r="1.6"/></svg>
            </div>
            <div class="stat-value" id="cPendingShip">0</div>
            <div class="stat-label">待发货</div>
        </div>
        <div class="stat-card" onclick="location.href='order-manage.html?status=SENT'">
            <div class="stat-icon" style="background:linear-gradient(135deg,#22d3ee,#06b6d4)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16v10H4z"/><path d="M4 11h16"/><path d="M8 17v2M16 17v2"/></svg>
            </div>
            <div class="stat-value" id="cPendingReceive">0</div>
            <div class="stat-label">待收货</div>
        </div>
        <div class="stat-card" onclick="location.href='order-manage.html?status=COMPLETED'">
            <div class="stat-icon" style="background:linear-gradient(135deg,#34d399,#10b981)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12l4 4 10-10"/></svg>
            </div>
            <div class="stat-value" id="cCompleted">0</div>
            <div class="stat-label">已完成</div>
        </div>
        <div class="stat-card" onclick="location.href='order-manage.html?afterSale=退款申请中'">
            <div class="stat-icon" style="background:linear-gradient(135deg,#f472b6,#ec4899)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
            </div>
            <div class="stat-value" id="cAfterSale">0</div>
            <div class="stat-label">退款 / 售后</div>
        </div>
        <div class="stat-card" onclick="location.href='product-manage.html?stockWarning=1'">
            <div class="stat-icon" style="background:linear-gradient(135deg,#a78bfa,#8b5cf6)">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l9 16H3z"/><path d="M12 9v4"/><path d="M12 16.5v.5"/></svg>
            </div>
            <div class="stat-value" id="cStockWarning">0</div>
            <div class="stat-label">库存预警</div>
        </div>
    </div>

    <!-- 趋势图 + 消息通知 -->
    <div class="content-grid">
        <div class="card chart-card">
            <div class="card-header">
                <div>
                    <div class="card-title">实时交易趋势</div>
                    <div class="card-sub">今日 / 昨日 24 小时支付金额对比</div>
                </div>
                <div class="legend">
                    <span><i style="background:#3b82f6"></i>今日支付金额</span>
                    <span><i style="background:#10b981"></i>昨日支付金额</span>
                </div>
            </div>
            <div class="chart-wrap"><canvas id="trendChart"></canvas></div>
        </div>

        <div class="card">
            <div class="card-header" style="margin-bottom:10px">
                <div class="card-title">消息通知</div>
                <span class="card-sub" id="unreadTip">加载中…</span>
            </div>
            <div class="message-list" id="messageList"><div class="loading">加载中…</div></div>
        </div>
    </div>

    <!-- 4 项经营指标 -->
    <div class="metrics-grid" id="metricsGrid"></div>
</div>

<script src="assets/common.js"></script>
<script>
    highlightNav('dashboard');

    async function loadDashboard() {
        try {
            const resp = await get('/dashboard', { shopId: SHOP_ID });
            if (resp.status !== 200) { toast(resp.message || '加载失败'); return; }
            renderDashboard(resp.data);
        } catch (e) {
            toast('无法连接后端服务，请确认 shop 服务已启动');
        }
    }

    function renderDashboard(d) {
        document.getElementById('cPendingPay').textContent = d.pendingPay;
        document.getElementById('cPendingShip').textContent = d.pendingShip;
        document.getElementById('cPendingReceive').textContent = d.pendingReceive;
        document.getElementById('cCompleted').textContent = d.completed;
        document.getElementById('cAfterSale').textContent = d.afterSale;
        document.getElementById('cStockWarning').textContent = d.stockWarning;

        renderMetrics(d.metrics || []);
        renderMessages(d.messages || []);
        drawChart(d.hours || [], d.todayAmounts || [], d.yesterdayAmounts || []);
    }

    function renderMetrics(metrics) {
        const grid = document.getElementById('metricsGrid');
        grid.innerHTML = metrics.map(m => {
            const isRefund = m.name.indexOf('退款') >= 0;
            let cls = 'rate-up';
            if (!m.up) cls = 'rate-down';
            else if (isRefund) cls = 'rate-bad';
            const arrow = m.up ? '▲' : '▼';
            return '<div class="metric-card">'
                + '<div class="metric-name">' + escapeHtml(m.name) + '</div>'
                + '<div class="metric-value">' + escapeHtml(m.value) + '</div>'
                + '<div class="metric-rate ' + cls + '">同比昨日 ' + arrow + ' ' + escapeHtml(m.rate) + '</div>'
                + '</div>';
        }).join('');
    }

    function renderMessages(messages) {
        const list = document.getElementById('messageList');
        const unread = messages.filter(m => !m.isRead).length;
        document.getElementById('unreadTip').textContent = unread + ' 条未读';
        if (!messages.length) {
            list.innerHTML = '<div class="empty">暂无消息</div>';
            return;
        }
        list.innerHTML = messages.map(m => {
            return '<div class="message-item" onclick="goOrder(' + m.orderId + ',' + m.id + ',event)">'
                + '<div class="message-top">'
                + '<span class="message-dot ' + (m.isRead ? 'read' : '') + '"></span>'
                + '<span class="message-title">' + escapeHtml(m.title) + '</span>'
                + '</div>'
                + '<div class="message-content">' + escapeHtml(m.content) + '</div>'
                + '<div class="message-time">' + escapeHtml(m.createdAt || '') + '</div>'
                + '</div>';
        }).join('');
    }

    function goOrder(orderId, msgId) {
        post('/dashboard/message/read?id=' + msgId).catch(() => {});
        if (orderId) {
            location.href = 'order-manage.html?orderId=' + orderId;
        }
    }

    function drawChart(hours, today, yesterday) {
        window._trendData = { h: hours, t: today, y: yesterday };
        const canvas = document.getElementById('trendChart');
        const dpr = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        const ctx = canvas.getContext('2d');
        ctx.scale(dpr, dpr);

        const w = rect.width, h = rect.height;
        const padL = 56, padR = 14, padT = 14, padB = 30;
        const plotW = w - padL - padR;
        const plotH = h - padT - padB;

        ctx.clearRect(0, 0, w, h);

        const maxVal = Math.max(1, ...today, ...yesterday);
        // Y 轴自动适配：取整到较友好的刻度
        const step = niceStep(maxVal / 4);
        const maxY = step * 4;

        ctx.font = '11px -apple-system, "Microsoft YaHei", sans-serif';
        ctx.fillStyle = '#9ca3af';
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        for (let i = 0; i <= 4; i++) {
            const y = padT + plotH - (plotH * i / 4);
            ctx.strokeStyle = i === 0 ? '#e5e7eb' : '#f3f4f6';
            ctx.beginPath();
            ctx.moveTo(padL, y);
            ctx.lineTo(w - padR, y);
            ctx.stroke();
            ctx.fillText(formatShort(step * i), padL - 8, y);
        }

        ctx.textAlign = 'center';
        ctx.textBaseline = 'top';
        hours.forEach((hr, i) => {
            if (hr % 2 !== 0) return;
            const x = padL + plotW * i / (hours.length - 1 || 1);
            ctx.fillText(hr + ':00', x, padT + plotH + 8);
        });

        drawLine(today, '#3b82f6', 'rgba(59,130,246,0.10)');
        drawLine(yesterday, '#10b981', 'rgba(16,185,129,0.06)');

        function drawLine(data, color, fillColor) {
            if (!data.length) return;
            const pts = data.map((v, i) => ({
                x: padL + plotW * i / (data.length - 1 || 1),
                y: padT + plotH - plotH * (Number(v || 0) / maxY)
            }));
            // 面积
            ctx.beginPath();
            ctx.moveTo(pts[0].x, padT + plotH);
            pts.forEach(p => ctx.lineTo(p.x, p.y));
            ctx.lineTo(pts[pts.length - 1].x, padT + plotH);
            ctx.closePath();
            ctx.fillStyle = fillColor;
            ctx.fill();
            // 折线
            ctx.beginPath();
            pts.forEach((p, i) => i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y));
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.lineJoin = 'round';
            ctx.stroke();
            // 数据点
            pts.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
                ctx.fillStyle = '#fff';
                ctx.fill();
                ctx.strokeStyle = color;
                ctx.lineWidth = 1.5;
                ctx.stroke();
            });
        }
    }

    function niceStep(v) {
        if (v <= 0) return 1;
        const exp = Math.floor(Math.log10(v));
        const base = Math.pow(10, exp);
        const n = v / base;
        let m;
        if (n <= 1) m = 1;
        else if (n <= 2) m = 2;
        else if (n <= 5) m = 5;
        else m = 10;
        return m * base;
    }

    function formatShort(v) {
        if (v >= 10000) return (v / 10000).toFixed(1) + '万';
        return v % 1 === 0 ? String(v) : v.toFixed(0);
    }

    window.addEventListener('resize', () => {
        if (window._trendData) {
            drawChart(window._trendData.h, window._trendData.t, window._trendData.y);
        }
    });

    loadDashboard();
    setInterval(loadDashboard, 60000);
</script>
</body>
</html>
