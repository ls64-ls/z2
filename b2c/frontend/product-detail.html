<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品详情 - ZSL 甄选商城</title>
    <link rel="stylesheet" href="assets/common.css">
    <style>
        body { background: #f5f5f5; }
        .mall-header {
            height: 62px; background: #fff; display: flex; align-items: center;
            padding: 0 32px; gap: 36px; position: sticky; top: 0; z-index: 100;
            box-shadow: 0 1px 4px rgba(0,0,0,.06);
        }
        .mall-logo { font-size: 20px; font-weight: 700; color: #e93b3d; }
        .mall-logo span { font-size: 13px; color: #9ca3af; font-weight: 400; margin-left: 8px; }
        .mall-nav { display: flex; gap: 20px; flex: 1; }
        .mall-nav a { font-size: 14px; color: #4b5563; }
        .mall-nav a.active { color: #e93b3d; font-weight: 600; border-bottom: 2px solid #e93b3d; padding-bottom: 4px; }
        .mall-user { display: flex; align-items: center; gap: 10px; font-size: 13px; color: #6b7280; }
        .mall-user .avatar {
            width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg,#fca5a5,#e93b3d);
            color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px;
        }

        .mall-main { max-width: 1180px; margin: 0 auto; padding: 20px 24px 60px; }
        .crumb { font-size: 13px; color: #9ca3af; margin-bottom: 14px; }
        .crumb a { color: #6b7280; }
        .crumb a:hover { color: #e93b3d; }

        .detail-card { background: #fff; border-radius: 12px; padding: 26px; display: flex; gap: 34px; }
        .detail-pic { width: 400px; height: 400px; border-radius: 10px; object-fit: cover; background: #f3f4f6; flex-shrink: 0; }
        .detail-info { flex: 1; min-width: 0; }
        .detail-name { font-size: 22px; font-weight: 600; line-height: 1.5; margin-bottom: 14px; }
        .price-box { background: #fff7f7; border-radius: 8px; padding: 16px 18px; margin-bottom: 18px; }
        .price-box .now { color: #e93b3d; font-size: 30px; font-weight: 700; }
        .price-box .now small { font-size: 16px; }
        .price-box .old { color: #9ca3af; text-decoration: line-through; font-size: 14px; margin-left: 12px; }
        .price-box .meta { display: flex; gap: 26px; margin-top: 8px; font-size: 13px; color: #6b7280; }
        .info-row { display: flex; gap: 14px; font-size: 13px; padding: 10px 0; border-bottom: 1px dashed #f0f0f0; }
        .info-row .k { width: 76px; color: #9ca3af; flex-shrink: 0; }
        .info-row .v { color: #374151; }
        .buy-row { display: flex; align-items: center; gap: 14px; margin-top: 24px; }
        .qty-box { display: flex; align-items: center; border: 1px solid #e5e7eb; border-radius: 6px; overflow: hidden; }
        .qty-box button { width: 34px; height: 36px; border: none; background: #f9fafb; font-size: 16px; cursor: pointer; color: #4b5563; }
        .qty-box input { width: 52px; height: 36px; border: none; text-align: center; font-size: 14px; }
        .btn-buy {
            height: 42px; padding: 0 36px; border: none; border-radius: 21px; background: #e93b3d;
            color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
        }
        .btn-buy:hover { background: #d32f2f; }
        .btn-cart {
            height: 42px; padding: 0 30px; border: 1px solid #e93b3d; border-radius: 21px;
            background: #fff; color: #e93b3d; font-size: 15px; cursor: pointer;
        }
        .desc-card { background: #fff; border-radius: 12px; padding: 24px; margin-top: 16px; }
        .desc-card h3 { font-size: 16px; margin-bottom: 14px; }
        .desc-card p { font-size: 14px; color: #4b5563; line-height: 1.9; }
        .tagline { display: inline-block; padding: 2px 8px; border-radius: 4px; background: #fff1f0; color: #e93b3d; font-size: 12px; margin-right: 8px; }
    </style>
</head>
<body>
<div class="mall-header">
    <div class="mall-logo">ZSL 甄选商城 <span>品质好物</span></div>
    <div class="mall-nav">
        <a href="mall.html">全部商品</a>
        <a href="my-orders.html">我的订单</a>
        <a href="dashboard.html">商家后台</a>
    </div>
    <div class="mall-user"><div class="avatar">用</div><span>user_1001</span></div>
</div>

<div class="mall-main">
    <div class="crumb"><a href="mall.html">首页</a> / <span id="crumbCat">全部商品</span> / <span id="crumbName">商品详情</span></div>
    <div class="detail-card" id="detailCard"><div class="loading">加载中…</div></div>
    <div class="desc-card" id="descCard" style="display:none">
        <h3>商品详情</h3>
        <p id="descText"></p>
    </div>
</div>

<script src="assets/common.js"></script>
<script>
    const pid = new URLSearchParams(location.search).get('id');

    async function loadDetail() {
        if (!pid) { document.getElementById('detailCard').innerHTML = '<div class="empty">缺少商品参数</div>'; return; }
        try {
            const resp = await get('/product/mall/detail', { id: pid });
            if (resp.status !== 200) {
                document.getElementById('detailCard').innerHTML = '<div class="empty">' + escapeHtml(resp.message) + '</div>';
                return;
            }
            render(resp.data);
        } catch (e) {
            document.getElementById('detailCard').innerHTML = '<div class="empty">无法加载商品，请确认 shop 服务已启动</div>';
        }
    }

    function render(p) {
        document.getElementById('crumbCat').textContent = p.category || '全部商品';
        document.getElementById('crumbName').textContent = p.name;
        document.title = p.name + ' - ZSL 甄选商城';

        document.getElementById('detailCard').innerHTML =
            '<img class="detail-pic" src="' + escapeHtml(imgSrc(p.coverImage)) + '" alt="' + escapeHtml(p.name) + '">'
            + '<div class="detail-info">'
            + '<div class="detail-name">' + escapeHtml(p.name) + '</div>'
            + '<div class="price-box">'
            + '<span class="now"><small>¥</small>' + money(p.salePrice) + '</span>'
            + '<span class="old">¥' + money(p.marketPrice) + '</span>'
            + '<div class="meta"><span>销量 ' + (p.sales || 0) + ' 件</span>'
            + '<span>库存 ' + ((p.warehouseStock || 0) + (p.storeStock || 0)) + '</span>'
            + '<span>' + escapeHtml(p.productType || '普通商品') + '</span></div>'
            + '</div>'
            + '<div class="info-row"><div class="k">商品分类</div><div class="v">' + escapeHtml(p.category || '-') + '</div></div>'
            + '<div class="info-row"><div class="k">商品类别</div><div class="v">' + escapeHtml(p.categoryLabel) + '</div></div>'
            + '<div class="info-row"><div class="k">配送方式</div><div class="v">'
            + escapeHtml((p.deliveryTypes || '').replace(/,/g, ' / ')) + '</div></div>'
            + '<div class="info-row"><div class="k">服务保障</div><div class="v">'
            + '<span class="tagline">正品保障</span><span class="tagline">7天无理由</span><span class="tagline">极速发货</span>'
            + '</div></div>'
            + '<div class="buy-row">'
            + '<div class="qty-box"><button onclick="changeQty(-1)">-</button>'
            + '<input id="qty" type="number" value="1" min="1"><button onclick="changeQty(1)">+</button></div>'
            + '<button class="btn-buy" onclick="buyNow()">立即购买</button>'
            + '<button class="btn-cart" onclick="addCart()">加入购物车</button>'
            + '</div>'
            + '</div>';

        document.getElementById('descCard').style.display = 'block';
        document.getElementById('descText').textContent = p.description || '暂无详细描述';
    }

    function changeQty(delta) {
        const input = document.getElementById('qty');
        let v = Number(input.value || 1) + delta;
        if (v < 1) v = 1;
        input.value = v;
    }

    function buyNow() {
        toast('已生成购买意向，请在「我的订单」查看与支付');
        setTimeout(() => location.href = 'my-orders.html', 900);
    }

    function addCart() {
        toast('已加入购物车');
    }

    loadDetail();
</script>
</body>
</html>
