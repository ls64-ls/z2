<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单查询 - B2C 商城后台</title>
    <link rel="stylesheet" href="assets/common.css">
    <style>
        .order-list { display: flex; flex-direction: column; gap: 14px; }

        .order-group { background: #fff; border-radius: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.05); overflow: hidden; }
        .order-head {
            display: flex; align-items: center; gap: 14px; padding: 11px 16px;
            background: #f9fafb; border-bottom: 1px solid #f3f4f6; font-size: 13px; color: #6b7280;
        }
        .order-head .no { color: #1f2937; font-weight: 500; }
        .order-head .spacer { flex: 1; }

        .order-body { display: flex; align-items: flex-start; gap: 18px; padding: 16px; }
        .items-col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
        .item-row { display: flex; gap: 12px; align-items: flex-start; }
        .item-row img { width: 56px; height: 56px; border-radius: 8px; object-fit: cover; background: #f3f4f6; flex-shrink: 0; }
        .item-main { flex: 1; min-width: 0; }
        .item-name { font-size: 13px; color: #1f2937; line-height: 1.5; margin-bottom: 6px; }
        .item-meta { font-size: 12px; color: #9ca3af; }
        .item-price { text-align: right; font-size: 13px; color: #374151; white-space: nowrap; }

        .col { width: 108px; flex-shrink: 0; font-size: 12px; line-height: 1.7; }
        .col .k { color: #9ca3af; }
        .col .v { color: #1f2937; word-break: break-all; }
        .col-amount { width: 120px; text-align: center; }
        .col-amount .amount { color: #ef4444; font-size: 16px; font-weight: 600; }
        .col-amount .qty { font-size: 12px; color: #9ca3af; margin-top: 2px; }
        .col-ops { width: 96px; display: flex; flex-direction: column; gap: 7px; align-items: flex-end; flex-shrink: 0; }

        .item-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }

        .date-quick { display: flex; gap: 6px; }
        .date-quick span {
            font-size: 12px; color: #6b7280; padding: 4px 10px; border-radius: 12px;
            background: #f3f4f6; cursor: pointer;
        }
        .date-quick span:hover { background: #e5e7eb; }
        .date-range { display: flex; align-items: center; gap: 6px; flex: 1; }
        .date-range input { width: 100%; }

        .detail-items { border: 1px solid #f3f4f6; border-radius: 8px; padding: 12px; margin: 14px 0; }
        .detail-item { display: flex; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid #f8f9fa; }
        .detail-item:last-child { border-bottom: none; }
        .detail-item img { width: 48px; height: 48px; border-radius: 6px; object-fit: cover; background: #f3f4f6; }
        .chat-area { height: 180px; background: #f9fafb; border-radius: 8px; padding: 12px; overflow-y: auto; font-size: 13px; }
        .chat-msg { margin-bottom: 10px; }
        .chat-msg .who { font-size: 11px; color: #9ca3af; margin-bottom: 3px; }
        .chat-msg .txt { background: #fff; border-radius: 6px; padding: 8px 10px; display: inline-block; max-width: 80%; }
        .chat-msg.me { text-align: right; }
        .chat-msg.me .txt { background: #eff6ff; color: #1d4ed8; }
    </style>
</head>
<body>
<div class="header">
    <div class="header-logo">B2C商城 <span>商家后台</span></div>
    <div class="header-nav">
        <a class="header-nav-item" data-nav="dashboard" href="dashboard.html">店铺 Dashboard</a>
        <a class="header-nav-item" data-nav="product" href="product-manage.html">商品管理</a>
        <a class="header-nav-item" data-nav="order" href="order-manage.html">订单管理</a>
        <a class="header-nav-item" href="mall.html">C 端商城</a>
    </div>
    <div class="header-right">
        <span>ZSL 甄选旗舰店</span>
        <div class="user-avatar">商</div>
    </div>
</div>

<div class="main">
    <div class="page-title">订单查询</div>

    <div class="card filter-card">
        <div class="filter-grid">
            <div class="filter-item"><label>订单编号</label><input type="text" id="fOrderNo" placeholder="精确输入订单号"></div>
            <div class="filter-item"><label>订单类型</label><select id="fOrderType"><option value="">全部</option></select></div>
            <div class="filter-item"><label>订单类别</label><select id="fOrderCategory"><option value="">全部</option></select></div>
            <div class="filter-item"><label>订单状态</label>
                <select id="fStatus">
                    <option value="">全部</option>
                    <option value="CREATED">待付款</option>
                    <option value="PAID">待发货</option>
                    <option value="SENT">待收货</option>
                    <option value="COMPLETED">交易成功</option>
                    <option value="CANCELLED">交易失败</option>
                    <option value="GROUPING">待成团</option>
                </select>
            </div>
            <div class="filter-item"><label>收件人姓名</label><input type="text" id="fReceiver" placeholder="模糊搜索"></div>
            <div class="filter-item"><label>联系电话</label><input type="text" id="fPhone" placeholder="模糊检索"></div>
            <div class="filter-item"><label>支付方式</label><select id="fPayType"><option value="">全部</option></select></div>
            <div class="filter-item"><label>售后状态</label><select id="fAfterSale"><option value="">全部</option></select></div>
            <div class="filter-item"><label>物流类型</label><select id="fLogistics"><option value="">全部</option></select></div>
            <div class="filter-item"><label>门店名称</label><input type="text" id="fStore" placeholder="门店名称"></div>
            <div class="filter-item" style="grid-column: span 2">
                <label>下单时间</label>
                <div class="date-range">
                    <input type="date" id="fStart">
                    <span style="color:#9ca3af">~</span>
                    <input type="date" id="fEnd">
                </div>
            </div>
            <div class="filter-item">
                <label></label>
                <div class="date-quick">
                    <span onclick="quickDate(0)">今日</span>
                    <span onclick="quickDate(1)">昨日</span>
                    <span onclick="quickDate(7)">近7天</span>
                    <span onclick="quickDate(30)">近30天</span>
                </div>
            </div>
        </div>
        <div class="filter-actions">
            <button class="btn btn-primary" onclick="searchList()">查询</button>
            <button class="btn" onclick="exportExcel()">导出</button>
            <button class="btn" onclick="resetFilters()">重置</button>
            <div class="spacer"></div>
            <button class="btn" onclick="batchShip()">批量发货</button>
        </div>
    </div>

    <div class="quick-tabs" id="quickTabs"></div>

    <div class="order-list" id="orderList"><div class="loading">加载中…</div></div>
    <div class="pagination" id="pagination"></div>
</div>

<!-- 订单详情 -->
<div class="modal-mask" id="detailModal">
    <div class="modal modal-lg">
        <div class="modal-header">
            <div class="modal-title">订单详情</div>
            <div class="modal-close" onclick="closeModal('detailModal')">×</div>
        </div>
        <div class="modal-body" id="detailBody"></div>
        <div class="modal-footer">
            <button class="btn" onclick="closeModal('detailModal')">关闭</button>
        </div>
    </div>
</div>

<!-- 发货 -->
<div class="modal-mask" id="shipModal">
    <div class="modal">
        <div class="modal-header">
            <div class="modal-title">订单发货</div>
            <div class="modal-close" onclick="closeModal('shipModal')">×</div>
        </div>
        <div class="modal-body">
            <div class="form-row">
                <label>物流类型</label>
                <select id="shipLogistics">
                    <option>普通快递</option>
                    <option>同城配送</option>
                </select>
            </div>
            <div class="form-row">
                <label>物流单号</label>
                <input id="shipNo" placeholder="请输入物流单号">
            </div>
            <p style="font-size:12px;color:#9ca3af" id="shipTip"></p>
        </div>
        <div class="modal-footer">
            <button class="btn" onclick="closeModal('shipModal')">取消</button>
            <button class="btn btn-primary" onclick="confirmShip()">确认发货</button>
        </div>
    </div>
</div>

<!-- 退款信息 -->
<div class="modal-mask" id="refundModal">
    <div class="modal">
        <div class="modal-header">
            <div class="modal-title">退款 / 售后信息</div>
            <div class="modal-close" onclick="closeModal('refundModal')">×</div>
        </div>
        <div class="modal-body" id="refundBody"></div>
        <div class="modal-footer">
            <button class="btn" onclick="closeModal('refundModal')">关闭</button>
        </div>
    </div>
</div>

<!-- 联系买家 -->
<div class="modal-mask" id="chatModal">
    <div class="modal">
        <div class="modal-header">
            <div class="modal-title" id="chatTitle">联系买家</div>
            <div class="modal-close" onclick="closeModal('chatModal')">×</div>
        </div>
        <div class="modal-body">
            <div class="chat-area" id="chatArea"></div>
            <div class="form-row" style="margin-top:12px;display:flex;gap:8px">
                <input id="chatInput" placeholder="输入消息内容" style="flex:1">
                <button class="btn btn-primary" onclick="sendChat()">发送</button>
            </div>
        </div>
    </div>
</div>

<script src="assets/common.js"></script>
<script>
    highlightNav('order');

    const state = {
        pageNum: 1, pageSize: 10, total: 0, status: '', list: [],
        selected: new Set(), shipIds: [], openedDetail: null
    };
    const urlParams = new URLSearchParams(location.search);

    const TABS = [
        { key: '', label: '全部' },
        { key: 'CREATED', label: '待付款' },
        { key: 'PAID', label: '待发货' },
        { key: 'SENT', label: '待收货' },
        { key: 'COMPLETED', label: '交易成功' },
        { key: 'CANCELLED', label: '交易失败' },
        { key: 'GROUPING', label: '待成团' }
    ];

    async function loadOptions() {
        const resp = await get('/product/options', { shopId: SHOP_ID });
        const d = resp.data || {};
        fill('fOrderType', d.orderTypes);
        fill('fOrderCategory', d.orderCategories);
        fill('fPayType', d.payTypes);
        fill('fAfterSale', d.afterSaleStatuses);
        fill('fLogistics', d.logisticsTypes);
    }

    function fill(id, arr) {
        const el = document.getElementById(id);
        (arr || []).forEach(v => {
            const o = document.createElement('option');
            o.value = v; o.textContent = v;
            el.appendChild(o);
        });
    }

    async function loadCounts() {
        const resp = await get('/order/status-count', { shopId: SHOP_ID });
        const d = resp.data || {};
        document.getElementById('quickTabs').innerHTML = TABS.map(t =>
            '<div class="quick-tab ' + (state.status === t.key ? 'active' : '') + '" onclick="switchTab(\'' + t.key + '\')">'
            + t.label + ' (' + (d[t.key || 'ALL'] || 0) + ')</div>').join('');
    }

    function switchTab(key) {
        state.status = key;
        state.pageNum = 1;
        state.selected.clear();
        loadCounts();
        loadList();
    }

    function query() {
        return {
            shopId: SHOP_ID,
            orderNo: document.getElementById('fOrderNo').value.trim(),
            orderType: document.getElementById('fOrderType').value,
            orderCategory: document.getElementById('fOrderCategory').value,
            status: state.status || document.getElementById('fStatus').value,
            receiverName: document.getElementById('fReceiver').value.trim(),
            phone: document.getElementById('fPhone').value.trim(),
            payType: document.getElementById('fPayType').value,
            afterSaleStatus: document.getElementById('fAfterSale').value || urlParams.get('afterSale') || '',
            logisticsType: document.getElementById('fLogistics').value,
            storeName: document.getElementById('fStore').value.trim(),
            startDate: document.getElementById('fStart').value,
            endDate: document.getElementById('fEnd').value,
            pageNum: state.pageNum,
            pageSize: state.pageSize
        };
    }

    async function loadList() {
        try {
            const resp = await get('/order/page', query());
            if (resp.status !== 200) { toast(resp.message || '加载失败'); return; }
            state.list = resp.data.list || [];
            state.total = resp.data.total || 0;
            renderList();
            renderPagination(document.getElementById('pagination'), state.pageNum, state.pageSize,
                state.total, p => { state.pageNum = p; loadList(); });
        } catch (e) {
            toast('加载订单失败，请确认后端服务');
        }
    }

    function renderList() {
        const box = document.getElementById('orderList');
        if (!state.list.length) {
            box.innerHTML = '<div class="card"><div class="empty">暂无符合条件的订单</div></div>';
            return;
        }
        box.innerHTML = state.list.map(o => {
            const items = (o.items || []).map(it => {
                const img = '<img src="' + escapeHtml(imgSrc(it.productImage)) + '" alt="">';
                return '<div class="item-row">' + img
                    + '<div class="item-main"><div class="item-name">' + escapeHtml(it.productName) + '</div>'
                    + '<div class="item-meta">单价 ¥' + money(it.unitPrice) + ' × ' + it.quantity + '</div>'
                    + '<div class="item-tags">' + (o.tags || []).map(t => tagBadge(t)).join('') + '</div>'
                    + '</div>'
                    + '<div class="item-price">¥' + money((it.unitPrice || 0) * (it.quantity || 0)) + '</div>'
                    + '</div>';
            }).join('');

            return '<div class="order-group">'
                + '<div class="order-head">'
                + '<input type="checkbox" ' + (state.selected.has(o.id) ? 'checked' : '')
                + ' onchange="toggleOne(' + o.id + ',this)">'
                + '<span>订单编号：<span class="no">' + escapeHtml(o.orderNo) + '</span></span>'
                + '<span>' + escapeHtml(o.createdAt || '') + '</span>'
                + (o.storeName ? '<span>门店：' + escapeHtml(o.storeName) + '</span>' : '')
                + '<span class="spacer"></span>'
                + statusBadge(o.status)
                + '</div>'
                + '<div class="order-body">'
                + '<div class="items-col">' + items + '</div>'
                + '<div class="col-amount"><div class="amount">¥' + money(o.amount) + '</div>'
                + '<div class="qty">共 ' + (o.totalQuantity || 0) + ' 件</div></div>'
                + '<div class="col"><div class="k">支付方式</div><div class="v">' + escapeHtml(o.payType || '-') + '</div></div>'
                + '<div class="col"><div class="k">买家 / 收货人</div><div class="v">'
                + escapeHtml(o.buyerNick || '-') + '</div><div class="v">'
                + escapeHtml(o.buyerName || '-') + '</div><div class="v">'
                + escapeHtml(o.buyerPhone || '-') + '</div></div>'
                + '<div class="col"><div class="k">订单状态</div><div class="v">' + escapeHtml(o.statusLabel) + '</div>'
                + '<div class="k" style="margin-top:6px">售后状态</div><div class="v">' + escapeHtml(o.afterSaleLabel) + '</div></div>'
                + '<div class="col-ops">'
                + '<span class="link" onclick="openDetail(' + o.id + ')">查看详情</span>'
                + '<span class="link" onclick="openChat(\'' + escapeHtml(o.buyerNick || o.buyerName || '买家') + '\')">联系买家</span>'
                + (o.status === 'PAID'
                    ? '<span class="link" onclick="openShip([' + o.id + '])">发货</span>' : '')
                + (o.afterSaleStatus && o.afterSaleStatus !== '暂无售后'
                    ? '<span class="link-danger" onclick="openRefund(' + o.id + ')">退款信息</span>' : '')
                + '</div>'
                + '</div></div>';
        }).join('');
    }

    function tagBadge(t) {
        const map = {
            '待发货': 'badge-blue', '待收货': 'badge-cyan', '退款申请中': 'badge-red',
            '电子卡券订单': 'badge-purple', '同城配送': 'badge-orange', '赠品': 'badge-green'
        };
        return '<span class="badge ' + (map[t] || 'badge-gray') + '">' + t + '</span>';
    }

    function toggleOne(id, el) {
        el.checked ? state.selected.add(id) : state.selected.delete(id);
    }

    function searchList() {
        state.pageNum = 1;
        state.selected.clear();
        loadCounts();
        loadList();
    }

    function resetFilters() {
        ['fOrderNo', 'fReceiver', 'fPhone', 'fStore', 'fStart', 'fEnd'].forEach(id => document.getElementById(id).value = '');
        ['fOrderType', 'fOrderCategory', 'fStatus', 'fPayType', 'fAfterSale', 'fLogistics']
            .forEach(id => document.getElementById(id).value = '');
        state.status = '';
        state.selected.clear();
        state.pageNum = 1;
        history.replaceState(null, '', 'order-manage.html');
        loadCounts();
        loadList();
    }

    function quickDate(days) {
        const today = new Date();
        let start, end;
        if (days === 0) { start = today; end = today; }
        else if (days === 1) { start = new Date(today.getTime() - 86400000); end = start; }
        else { start = new Date(today.getTime() - (days - 1) * 86400000); end = today; }
        document.getElementById('fStart').value = ymd(start);
        document.getElementById('fEnd').value = ymd(end);
    }

    function exportExcel() {
        const q = query();
        delete q.pageNum; delete q.pageSize;
        window.open(API + '/order/export?' + qs(q), '_blank');
    }

    // ===== 详情 =====
    async function openDetail(id) {
        const resp = await get('/order/detail', { id: id });
        if (resp.status !== 200) { toast(resp.message); return; }
        const o = resp.data.order;
        const r = resp.data.refund;
        const items = (o.items || []).map(it =>
            '<div class="detail-item">'
            + '<img src="' + escapeHtml(imgSrc(it.productImage)) + '" alt="">'
            + '<div style="flex:1"><div style="font-size:13px">' + escapeHtml(it.productName) + '</div>'
            + '<div style="font-size:12px;color:#9ca3af">¥' + money(it.unitPrice) + ' × ' + it.quantity + '</div></div>'
            + '<div class="price-amount">¥' + money((it.unitPrice || 0) * (it.quantity || 0)) + '</div></div>').join('');

        document.getElementById('detailBody').innerHTML =
            '<div class="info-list">'
            + kv('订单编号', o.orderNo)
            + kv('下单时间', o.createdAt)
            + kv('订单状态', o.statusLabel)
            + kv('售后状态', o.afterSaleLabel)
            + kv('订单类型', o.orderType)
            + kv('订单类别', o.orderCategory)
            + kv('支付方式', o.payType)
            + kv('支付时间', o.paidAt)
            + kv('发货时间', o.shippedAt)
            + kv('物流类型', o.logisticsType)
            + kv('物流单号', o.deliveryNo)
            + kv('门店名称', o.storeName)
            + kv('买家账号', o.buyerNick)
            + kv('收货人', o.buyerName)
            + kv('联系电话', o.buyerPhone)
            + kv('收货地址', o.buyerAddress)
            + '</div>'
            + '<div class="detail-items">' + items + '</div>'
            + '<div style="text-align:right;font-size:14px">实付金额：<span class="price-amount" style="font-size:18px">¥'
            + money(o.amount) + '</span> <span style="color:#9ca3af;font-size:12px">共 ' + o.totalQuantity + ' 件</span></div>'
            + (r ? '<div style="margin-top:14px;padding:12px;background:#fef2f2;border-radius:8px;font-size:13px;color:#b91c1c">'
                + '退款单号：' + escapeHtml(r.refundNo) + '，金额 ¥' + money(r.amount)
                + '，状态：' + escapeHtml(r.status) + '，原因：' + escapeHtml(r.reason) + '</div>' : '');
        openModal('detailModal');
    }

    function kv(k, v) {
        return '<div class="k">' + k + '</div><div class="v">' + escapeHtml(v || '-') + '</div>';
    }

    // ===== 发货 =====
    function openShip(ids) {
        state.shipIds = ids;
        document.getElementById('shipNo').value = '';
        document.getElementById('shipTip').textContent = '将对 ' + ids.length + ' 个订单执行发货';
        openModal('shipModal');
    }

    function batchShip() {
        if (!state.selected.size) { toast('请先勾选待发货订单'); return; }
        const paidIds = state.list.filter(o => state.selected.has(o.id) && o.status === 'PAID').map(o => o.id);
        if (!paidIds.length) { toast('所选订单中没有待发货订单'); return; }
        openShip(paidIds);
    }

    async function confirmShip() {
        const body = {
            orderIds: state.shipIds,
            logisticsType: document.getElementById('shipLogistics').value,
            deliveryNo: document.getElementById('shipNo').value.trim()
        };
        const resp = await post('/order/ship', body);
        toast(resp.message || '操作完成');
        if (resp.status === 200) {
            closeModal('shipModal');
            state.selected.clear();
            loadCounts();
            loadList();
        }
    }

    // ===== 退款 =====
    async function openRefund(orderId) {
        const resp = await get('/order/refund', { orderId: orderId });
        if (resp.status !== 200) { toast(resp.message); return; }
        const r = resp.data;
        document.getElementById('refundBody').innerHTML =
            '<div class="info-list">'
            + kv('退款单号', r.refundNo)
            + kv('关联订单号', r.orderNo)
            + kv('退款金额', '¥' + money(r.amount))
            + kv('退款状态', r.status)
            + kv('申请原因', r.reason)
            + kv('申请时间', r.createdAt)
            + kv('处理时间', r.handledAt)
            + '</div>';
        openModal('refundModal');
    }

    // ===== 联系买家（演示聊天窗口） =====
    function openChat(name) {
        document.getElementById('chatTitle').textContent = '联系买家 - ' + name;
        document.getElementById('chatArea').innerHTML = '<div class="chat-msg"><div class="who">买家</div>'
            + '<div class="txt">您好，请问我的订单什么时候发货？</div></div>';
        document.getElementById('chatInput').value = '';
        openModal('chatModal');
    }

    function sendChat() {
        const input = document.getElementById('chatInput');
        const txt = input.value.trim();
        if (!txt) return;
        const area = document.getElementById('chatArea');
        area.innerHTML += '<div class="chat-msg me"><div class="who">我</div><div class="txt">'
            + escapeHtml(txt) + '</div></div>';
        input.value = '';
        area.scrollTop = area.scrollHeight;
    }

    (async function init() {
        if (urlParams.get('status')) state.status = urlParams.get('status');
        if (urlParams.get('orderNo')) document.getElementById('fOrderNo').value = urlParams.get('orderNo');
        await loadOptions();
        await loadCounts();
        await loadList();
        if (urlParams.get('orderId')) openDetail(Number(urlParams.get('orderId')));
    })();
</script>
