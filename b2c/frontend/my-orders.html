<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的订单 - ZSL 甄选商城</title>
    <link rel="stylesheet" href="assets/common.css">
    <style>
        body { background: #f5f5f5; }
        .mall-header {
            height: 62px; background: #fff; display: flex; align-items: center;
            padding: 0 32px; gap: 36px; position: sticky; top: 0; z-index: 100;
            box-shadow: 0 1px 4px rgba(0,0,0,.06);
        }
        .mall-logo { font-size: 20px; font-weight: 700; color: #e93b3d; }
        .mall-logo span { font-size: 13px; color: #9ca3af; font-weight: 400; margin-left: 8px; }
        .mall-nav { display: flex; gap: 20px; flex: 1; }
        .mall-nav a { font-size: 14px; color: #4b5563; }
        .mall-nav a.active { color: #e93b3d; font-weight: 600; border-bottom: 2px solid #e93b3d; padding-bottom: 4px; }
        .mall-user { display: flex; align-items: center; gap: 10px; font-size: 13px; color: #6b7280; }
        .mall-user .avatar {
            width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg,#fca5a5,#e93b3d);
            color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px;
        }

        .mall-main { max-width: 1040px; margin: 0 auto; padding: 22px 24px 60px; }
        .page-h { font-size: 20px; font-weight: 600; margin-bottom: 16px; }

        .order-tabs {
            display: flex; background: #fff; border-radius: 10px; padding: 0 8px; margin-bottom: 14px;
            overflow-x: auto;
        }
        .order-tab {
            padding: 15px 22px; font-size: 14px; color: #4b5563; cursor: pointer;
            border-bottom: 2px solid transparent; white-space: nowrap; user-select: none;
        }
        .order-tab.active { color: #e93b3d; font-weight: 600; border-bottom-color: #e93b3d; }

        .search-bar {
            display: flex; gap: 10px; background: #fff; border-radius: 10px;
            padding: 12px 16px; margin-bottom: 16px;
        }
        .search-bar input {
            flex: 1; height: 38px; border: 1px solid #e5e7eb; border-radius: 6px;
            padding: 0 14px; font-size: 13px;
        }
        .search-bar input:focus { border-color: #e93b3d; }
        .btn-red {
            height: 38px; padding: 0 24px; border: none; border-radius: 6px;
            background: #e93b3d; color: #fff; font-size: 14px; cursor: pointer;
        }
        .btn-red:hover { background: #d32f2f; }

        .order-card { background: #fff; border-radius: 10px; margin-bottom: 14px; overflow: hidden; }
        .oc-head {
            display: flex; align-items: center; gap: 18px; padding: 12px 18px;
            border-bottom: 1px solid #f5f5f5; font-size: 13px; color: #9ca3af;
        }
        .oc-head .no { color: #4b5563; }
        .oc-head .shop { display: flex; align-items: center; gap: 6px; color: #374151; }
        .oc-head .shop svg { width: 15px; height: 15px; color: #e93b3d; }
        .oc-head .spacer { flex: 1; }
        .trash {
            width: 26px; height: 26px; border-radius: 6px; display: flex; align-items: center;
            justify-content: center; cursor: pointer; color: #9ca3af;
        }
        .trash:hover { background: #fef2f2; color: #e93b3d; }
        .trash svg { width: 15px; height: 15px; }

        .oc-body { display: flex; padding: 14px 18px; gap: 20px; }
        .oc-items { flex: 1; display: flex; flex-direction: column; gap: 13px; }
        .oc-item { display: flex; gap: 12px; align-items: flex-start; }
        .oc-item img { width: 62px; height: 62px; border-radius: 8px; object-fit: cover; background: #f3f4f6; }
        .oc-item .n { font-size: 13px; color: #1f2937; line-height: 1.5; margin-bottom: 8px; }
        .oc-item .m { font-size: 12px; color: #9ca3af; }
        .oc-item .u { font-size: 12px; color: #4b5563; margin-top: 2px; }

        .oc-total { width: 150px; text-align: right; flex-shrink: 0; }
        .oc-total .label { font-size: 12px; color: #9ca3af; }
        .oc-total .amt { font-size: 17px; font-weight: 600; color: #1f2937; margin-top: 2px; }

        .oc-foot {
            display: flex; align-items: center; gap: 12px; padding: 12px 18px;
            border-top: 1px solid #f5f5f5; background: #fcfcfc;
        }
        .oc-foot .status { font-size: 13px; color: #4b5563; }
        .oc-foot .status b { color: #e93b3d; font-weight: 600; }
        .oc-foot .spacer { flex: 1; }
        .btn-outline {
            height: 32px; padding: 0 18px; border: 1px solid #d1d5db; border-radius: 16px;
            background: #fff; color: #4b5563; font-size: 13px; cursor: pointer;
        }
        .btn-outline:hover { border-color: #e93b3d; color: #e93b3d; }
        .btn-outline.red { border-color: #e93b3d; color: #e93b3d; }
        .btn-outline.red:hover { background: #e93b3d; color: #fff; }

        .detail-grid { display: grid; grid-template-columns: 100px 1fr; gap: 9px 12px; font-size: 13px; }
        .detail-grid .k { color: #9ca3af; }
        @media (max-width: 760px) { .oc-body { flex-direction: column; } .oc-total { width: 100%; text-align: left; } }
    </style>
</head>
<body>
<div class="mall-header">
    <div class="mall-logo">ZSL 甄选商城 <span>品质好物</span></div>
    <div class="mall-nav">
        <a href="mall.html">全部商品</a>
        <a href="my-orders.html" class="active">我的订单</a>
        <a href="dashboard.html">商家后台</a>
    </div>
    <div class="mall-user"><div class="avatar">用</div><span>user_1001</span></div>
</div>

<div class="mall-main">
    <div class="page-h">我的订单</div>

    <div class="order-tabs" id="tabs"></div>

    <div class="search-bar">
        <input id="searchNo" placeholder="请输入订单编号查询">
        <button class="btn-red" onclick="searchOrder()">查询订单</button>
    </div>

    <div id="orderList"><div class="card"><div class="loading">加载中…</div></div></div>
    <div class="pagination" id="pagination" style="background:transparent"></div>
</div>

<!-- 订单详情 -->
<div class="modal-mask" id="detailModal">
    <div class="modal">
        <div class="modal-header">
            <div class="modal-title">订单详情</div>
            <div class="modal-close" onclick="closeModal('detailModal')">×</div>
        </div>
        <div class="modal-body" id="detailBody"></div>
        <div class="modal-footer">
            <button class="btn" onclick="closeModal('detailModal')">关闭</button>
        </div>
    </div>
</div>

<script src="assets/common.js"></script>
<script>
    const state = { tab: 'ALL', orderNo: '', pageNum: 1, pageSize: 5, total: 0, list: [] };
    const TABS = [
        { key: 'ALL', label: '全部订单' },
        { key: 'CREATED', label: '待付款' },
        { key: 'PAID', label: '待发货' },
        { key: 'SENT', label: '待收货' },
        { key: 'COMPLETED', label: '已完成' }
    ];
    const C_STATUS = {
        CREATED: '待付款', PAID: '待发货', SENT: '待收货',
        COMPLETED: '已完成', CANCELLED: '已取消', GROUPING: '待成团'
    };

    async function loadCounts() {
        try {
            const resp = await get('/c/order/status-count', { userId: USER_ID });
            const d = resp.data || {};
            document.getElementById('tabs').innerHTML = TABS.map(t =>
                '<div class="order-tab ' + (state.tab === t.key ? 'active' : '') + '" onclick="switchTab(\'' + t.key + '\')">'
                + t.label + '（' + (d[t.key] || 0) + '）</div>').join('');
        } catch (e) {
            document.getElementById('tabs').innerHTML = TABS.map(t =>
                '<div class="order-tab ' + (state.tab === t.key ? 'active' : '') + '" onclick="switchTab(\'' + t.key + '\')">'
                + t.label + '</div>').join('');
        }
    }

    function switchTab(key) {
        state.tab = key;
        state.pageNum = 1;
        loadCounts();
        loadOrders();
    }

    function searchOrder() {
        state.orderNo = document.getElementById('searchNo').value.trim();
        state.pageNum = 1;
        loadOrders();
    }

    async function loadOrders() {
        const box = document.getElementById('orderList');
        try {
            const resp = await get('/c/order/list', {
                userId: USER_ID,
                status: state.tab,
                orderNo: state.orderNo,
                pageNum: state.pageNum,
                pageSize: state.pageSize
            });
            if (resp.status !== 200) { toast(resp.message); return; }
            state.list = resp.data.list || [];
            state.total = resp.data.total || 0;
            renderList();
            renderPagination(document.getElementById('pagination'), state.pageNum, state.pageSize,
                state.total, p => { state.pageNum = p; loadOrders(); });
        } catch (e) {
            box.innerHTML = '<div class="card"><div class="empty">无法加载订单，请确认 shop 服务已启动</div></div>';
        }
    }

    function renderList() {
        const box = document.getElementById('orderList');
        if (!state.list.length) {
            box.innerHTML = '<div class="card"><div class="empty">暂无相关订单</div></div>';
            return;
        }
        box.innerHTML = state.list.map(o => {
            const items = (o.items || []).map(it =>
                '<div class="oc-item">'
                + '<img src="' + escapeHtml(imgSrc(it.productImage)) + '" alt="">'
                + '<div style="flex:1"><div class="n">' + escapeHtml(it.productName) + '</div>'
                + '<div class="m">x' + it.quantity + '</div>'
                + '<div class="u">单价 ¥' + money(it.unitPrice) + '</div></div>'
                + '</div>').join('');

            const statusText = C_STATUS[o.status] || o.statusLabel;
            const payText = o.status === 'PAID' && o.payType ? '（' + o.payType + '）' : '';

            return '<div class="order-card">'
                + '<div class="oc-head">'
                + '<span>订单编号：<span class="no">' + escapeHtml(o.orderNo) + '</span></span>'
                + '<span class="shop">'
                + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l1-5h16l1 5"/><path d="M4 9v11h16V9"/><path d="M9 20v-6h6v6"/></svg>'
                + escapeHtml(o.shopName || 'ZSL 甄选旗舰店')
                + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2 4.2 2 2 0 0 1 4 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.2-1.1a2 2 0 0 1 2.1-.5c.9.3 1.9.6 2.9.7a2 2 0 0 1 1.7 2z"/></svg>'
                + '</span>'
                + '<span class="spacer"></span>'
                + '<span class="trash" title="删除订单" onclick="deleteOrder(' + o.id + ')">'
                + '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/></svg>'
                + '</span>'
                + '</div>'
                + '<div class="oc-body">'
                + '<div class="oc-items">' + items + '</div>'
                + '<div class="oc-total"><div class="label">订单合计</div>'
                + '<div class="amt">¥' + money(o.amount) + '</div>'
                + '<div class="label" style="margin-top:4px">共 ' + (o.totalQuantity || 0) + ' 件</div></div>'
                + '</div>'
                + '<div class="oc-foot">'
                + '<span class="status">订单状态：<b>' + escapeHtml(statusText + payText) + '</b></span>'
                + '<span class="spacer"></span>'
                + '<button class="btn-outline" onclick="openDetail(' + o.id + ')">订单详情</button>'
                + '<button class="btn-outline red" onclick="rebuy(' + o.id + ')">立即购买</button>'
                + '<button class="btn-outline" onclick="deleteOrder(' + o.id + ')">删除订单</button>'
                + '</div>'
                + '</div>';
        }).join('');
    }

    async function deleteOrder(id) {
        if (!confirmAction('确定要删除该订单吗？删除后仅在本页隐藏，后台仍保留订单数据。')) return;
        const resp = await post('/c/order/delete', { id: id, userId: USER_ID });
        toast(resp.message || '操作完成');
        if (resp.status === 200) { loadCounts(); loadOrders(); }
    }

    async function rebuy(orderId) {
        const resp = await get('/c/order/rebuy', { orderId: orderId });
        const d = resp.data || {};
        if (d.productId) {
            toast('即将跳转商品下单页');
            setTimeout(() => location.href = 'product-detail.html?id=' + d.productId, 700);
        } else {
            toast('商品信息不存在');
        }
    }

    async function openDetail(id) {
        const resp = await get('/c/order/detail', { id: id, userId: USER_ID });
        if (resp.status !== 200) { toast(resp.message); return; }
        const o = resp.data;
        const items = (o.items || []).map(it =>
            '<div style="display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid #f5f5f5">'
            + '<img src="' + escapeHtml(imgSrc(it.productImage)) + '" style="width:48px;height:48px;border-radius:6px;object-fit:cover">'
            + '<div style="flex:1"><div style="font-size:13px">' + escapeHtml(it.productName) + '</div>'
            + '<div style="font-size:12px;color:#9ca3af">¥' + money(it.unitPrice) + ' × ' + it.quantity + '</div></div>'
            + '<div style="color:#e93b3d;font-weight:600">¥' + money((it.unitPrice || 0) * (it.quantity || 0)) + '</div></div>').join('');

        document.getElementById('detailBody').innerHTML =
            '<div class="detail-grid">'
            + '<div class="k">订单编号</div><div>' + escapeHtml(o.orderNo) + '</div>'
            + '<div class="k">订单状态</div><div>' + (C_STATUS[o.status] || o.statusLabel) + '</div>'
            + '<div class="k">下单时间</div><div>' + escapeHtml(o.createdAt || '-') + '</div>'
            + '<div class="k">支付方式</div><div>' + escapeHtml(o.payType || '-') + '</div>'
            + '<div class="k">物流类型</div><div>' + escapeHtml(o.logisticsType || '-') + '</div>'
            + '<div class="k">物流单号</div><div>' + escapeHtml(o.deliveryNo || '-') + '</div>'
            + '<div class="k">收货人</div><div>' + escapeHtml(o.buyerName || '-') + ' ' + escapeHtml(o.buyerPhone || '') + '</div>'
            + '<div class="k">收货地址</div><div>' + escapeHtml(o.buyerAddress || '-') + '</div>'
            + '</div>'
            + '<div style="margin-top:14px">' + items + '</div>'
            + '<div style="text-align:right;margin-top:12px;font-size:14px">订单一共 <b>' + o.totalQuantity + '</b> 件，合计：'
            + '<span style="color:#e93b3d;font-size:18px;font-weight:700">¥' + money(o.amount) + '</span></div>';
        openModal('detailModal');
    }

    loadCounts();
    loadOrders();
</script>
</body>
</html>
