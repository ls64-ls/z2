name: xm1-b2c

# 所有微服务共用的注册中心与数据库连接参数
x-java-env: &java-env
  NACOS_ADDR: nacos:8848
  NACOS_NAMESPACE: public
  SPRING_DATASOURCE_USERNAME: root
  SPRING_DATASOURCE_PASSWORD: root123456
  TZ: Asia/Shanghai

x-java-common: &java-common
  restart: unless-stopped
  environment:
    <<: *java-env
  depends_on:
    mysql:
      condition: service_healthy
    nacos:
      condition: service_healthy
  networks:
    - b2c

services:
  # ---------------- 基础设施 ----------------
  mysql:
    build: ./docker/mysql
    image: 2505273113mysql:8.0
    container_name: xm1-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-authentication-plugin=mysql_native_password
      - --innodb-buffer-pool-size=16M
      - --performance-schema=OFF
      - --skip-log-bin
      - --max-connections=100
    ports:
      - "13306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    mem_limit: 300m
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot123456 --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - b2c

  nacos:
    image: nacos/nacos-server:v1.4.8
    container_name: xm1-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      PREFER_HOST_MODE: hostname
      JVM_XMS: 64m
      JVM_XMX: 160m
      JVM_XMN: 48m
      TZ: Asia/Shanghai
    ports:
      - "8858:8848"
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
    mem_limit: 280m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    networks:
      - b2c

  redis:
    image: redis:7-alpine
    container_name: xm1-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 32mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    mem_limit: 96m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - b2c

  # ---------------- 微服务 ----------------
  gateway:
    <<: *java-common
    build: ./gateway
    image: 2505273113gateway:1.0
    container_name: xm1-gateway
    environment:
      <<: *java-env
      JAVA_OPTS: "-Xms32m -Xmx96m -XX:MaxMetaspaceSize=80m -XX:+UseSerialGC -XX:ReservedCodeCacheSize=16m -Xss256k -XX:TieredStopAtLevel=1"
    ports:
      - "8088:8088"
    mem_limit: 200m

  shop:
    <<: *java-common
    build: ./shop
    image: 2505273113shop:1.0
    container_name: xm1-shop
    environment:
      <<: *java-env
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/b2cmall_shop?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
      JAVA_OPTS: "-Xms48m -Xmx112m -XX:MaxMetaspaceSize=96m -XX:+UseSerialGC -XX:ReservedCodeCacheSize=16m -Xss256k -XX:TieredStopAtLevel=1"
    mem_limit: 240m

  employee:
    <<: *java-common
    build: ./employee
    image: 2505273113employee:1.0
    container_name: xm1-employee
    environment:
      <<: *java-env
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/b2cmall_employee?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: "6379"
      JAVA_OPTS: "-Xms48m -Xmx112m -XX:MaxMetaspaceSize=96m -XX:+UseSerialGC -XX:ReservedCodeCacheSize=16m -Xss256k -XX:TieredStopAtLevel=1"
    mem_limit: 240m

  order:
    <<: *java-common
    build: ./order
    image: 2505273113order:1.0
    container_name: xm1-order
    environment:
      <<: *java-env
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/b2cmall_shop?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
      JAVA_OPTS: "-Xms48m -Xmx96m -XX:MaxMetaspaceSize=96m -XX:+UseSerialGC -XX:ReservedCodeCacheSize=16m -Xss256k -XX:TieredStopAtLevel=1"
    mem_limit: 220m

  # ---------------- 前端 ----------------
  nginx:
    build: ./frontend
    image: 2505273113web:1.0
    container_name: xm1-web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - shop
      - employee
      - order
      - gateway
    mem_limit: 64m
    networks:
      - b2c

volumes:
  mysql-data:
  nacos-data:
  nacos-logs:
  redis-data:

networks:
  b2c:
    name: xm1-b2c-net
